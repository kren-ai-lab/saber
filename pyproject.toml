[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlcore"
dynamic = ["version"]

description = "Domain-agnostic classical supervised machine learning for classification, regression, tuning, and benchmarking."

readme = "README.md"

license = { text = "MIT" }

requires-python = ">=3.11,<3.14"

authors = [
    { name = "Kren AI Lab", email = "krenai@umag.cl" },
]

keywords = [
    "machine-learning",
    "supervised-learning",
    "tabular-data",
    "classification",
    "regression",
    "benchmarking",
    "optuna",
    "xgboost",
    "lightgbm",
    "reproducibility",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=2.0,<3.0",
    "pandas>=2.0,<3.0",
    "scikit-learn>=1.8,<2.0",
    "scipy>=1.10,<2.0",
    "joblib>=1.3,<2.0",
    "rich>=13.0,<16.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
biosieve = [
    "biosieve>=0.1.2,<0.2",
]

xgboost = [
    "xgboost>=2.0,<4.0",
]

lightgbm = [
    "lightgbm>=4.0,<5.0",
]

optuna = [
    "optuna>=4.0,<5.0",
]

all = [
    "biosieve>=0.1.2,<0.2",
    "xgboost>=2.0,<4.0",
    "lightgbm>=4.0,<5.0",
    "optuna>=4.0,<5.0",
]

dev = [
    "biosieve>=0.1.2,<0.2",
    "pytest~=9.0.2",
    "pytest-cov~=7.1.0",
    "matplotlib>=3.8,<4.0",
    "xgboost>=2.0,<4.0",
    "lightgbm>=4.0,<5.0",
    "optuna>=4.0,<5.0",
]


tests = [
    "biosieve>=0.1.2,<0.2",
    "pytest~=9.0.2",
    "pytest-cov~=7.1.0",
    "matplotlib>=3.8,<4.0",
    "xgboost>=2.0,<4.0",
    "lightgbm>=4.0,<5.0",
    "optuna>=4.0,<5.0",
]

[project.scripts]
mlcore = "mlcore.cli.main:main"

[project.urls]
Documentation = "https://github.com/kren-ai-lab/mlcore#readme"
Homepage = "https://github.com/kren-ai-lab/mlcore"
Issues = "https://github.com/kren-ai-lab/mlcore/issues"
Source = "https://github.com/kren-ai-lab/mlcore"

[tool.hatch.version]
path = "mlcore/__init__.py"
pattern = "__version__ = \"(?P<version>[^\"]+)\""

[tool.hatch.build.targets.sdist]
include = [
    "/mlcore",
]
