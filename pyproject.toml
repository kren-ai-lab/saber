[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlcore"
dynamic = ["version"]

description = "Classical machine learning framework for classification, regression, evaluation, tuning, and benchmarking."

readme = "README.md"

license = { text = "MIT" }

requires-python = ">=3.11,<3.14"

authors = [
    { name = "Kren AI Lab", email = "krenai@umag.cl" },
]

keywords = [
    "machine-learning",
    "classification",
    "regression",
    "benchmarking",
    "optuna",
    "tpot",
    "xgboost",
    "lightgbm",
    "bioinformatics",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=2.0,<3.0",
    "pandas>=2.0,<3.0",
    "scikit-learn>=1.8,<2.0",
    "scipy>=1.10,<2.0",
    "joblib>=1.3,<2.0",
    "rich>=13.0,<16.0",
    "dataclasses>=0.6",
    "lightgbm>=4.0,<5.0",
    "xgboost>=2.0,<4.0",
    "optuna>=4.0,<5.0",
    "tpot>=1.0,<2.0",
]

[project.optional-dependencies]

dev = [
    "pytest~=9.0.2",
    "pytest-cov~=7.1.0",
    "ruff~=0.15.5",
    "taskipy~=1.14.0",
    "pyrefly>=0.60.0",
    "ty>=0.0.30",
]

tests = [
    "pytest~=9.0.2",
    "pytest-cov~=7.1.0",
]

[project.urls]
Documentation = "https://github.com/kren-ai-lab/mlcore#readme"
Homepage = "https://github.com/kren-ai-lab/mlcore"
Issues = "https://github.com/kren-ai-lab/mlcore/issues"
Source = "https://github.com/kren-ai-lab/mlcore"

[tool.hatch.version]
path = "mlcore/__init__.py"
pattern = "__version__ = \"(?P<version>[^\"]+)\""

[tool.hatch.build.targets.sdist]
include = [
    "/mlcore",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "D203",
    "D213",
    "N802",
    "N803",
    "N806",
    "PLR0913",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "D",
    "PLC0415",
    "PLR2004",
    "S101",
]

[tool.taskipy.tasks]
sort-imports = "ruff check --fix --select I,F401 mlcore/ tests/"
format = "task sort-imports && ruff format mlcore/ tests/"
lint = "ruff check mlcore/ tests/"
lint-fix = "ruff check --fix mlcore/ tests/"
test = "pytest -q"
test-v = "pytest -v"
test-cov = "pytest --cov=mlcore --cov-report=html"
pyrefly = "pyrefly check mlcore/ tests/"
ty = "ty check mlcore/ tests/"