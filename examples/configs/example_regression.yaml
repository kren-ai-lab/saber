schema_version: "1.0"
workflow: tune

dataset:
  path: data/regression.csv
  target_col: target
  sample_id_col: sample_id

algorithm: ridge_regressor

partitioning:
  strategy: random_kfold
  params:
    n_splits: 5
    seed: 42

preprocessing:
  imputation: auto
  scaler: auto

tuning:
  optimizer: grid
  refit_metric: rmse

search_space:
  alpha:
    type: categorical
    values: [0.01, 0.1, 1.0, 10.0]

metrics:
  - rmse
  - mae

random_state: 42

output: results/regression_tuning
