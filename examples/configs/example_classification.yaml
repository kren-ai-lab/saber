schema_version: "2.0"
workflow: validate

dataset:
  path: data/classification.csv
  target_col: label
  sample_id_col: sample_id

algorithm: logistic_regression

partitioning:
  strategy: stratified_kfold
  params:
    n_splits: 5
    seed: 42

preprocessing:
  imputation: auto
  scaler: auto

metrics:
  - mcc
  - balanced_accuracy
  - roc_auc

random_state: 42

output: results/classification
